$schema: "https://json-schema.org/draft/2020-12/schema"
description: snakemake configuration file
type: object
properties:
  samples:
    type: string
    minLength: 1
  units:
    type: string
    minLength: 1
  resources:
    type: string
    minLength: 1
    description: Path to resources.yaml file
  default_container:
    type: string
    minLength: 1
    description: name or path to a default docker/singularity container
  reference:
    type: object
    properties:
      design_bed:
        type: string
        minLength: 1
        description: path to the panel design bed file
      dict:
        type: string
        minLength: 1
        description: path to the reference sequence dictionary (.dict)
      fasta:
        type: string
        minLength: 1
        description: path to fasta reference file
      mappability:
        type: string
        minLength: 1
        description: path to fasta mappability file
    required:
      - fasta
  bcftools_merge:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra parameters sent to bcftools_merge
      info_rules:
        type: string
        minLength: 1
        description: option how bcftools should merge info in the vcf file
      output_type:
        type: string
        minLength: 1
        description: output file zip option

  bed_to_interval_list:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  cnvkit_create_targets:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  cnvkit_create_anti_targets:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  cnvkit_build_normal_reference:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      mappability:
        type: string
        minLength: 1
        description: file with mappability information
      extra:
        type: string
        description: extra parameters sent to cnvkit_build_normal_reference

  create_background_file:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      min_dp:
        type: integer
        description: min depth to be included in the background calculation
      max_af:
        type: float
        description: max variant allele frequency to be included in the background calculation

  create_artifact_file:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      callers:
        type: array
        items:
            type: string
            minLength: 1
        description: list of variant callers to include

  collect_read_counts:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra parameters sent to collect_read_counts (needs -imr OVERLAPPING_ONLY)

  create_read_count_panel_of_normals:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra parameters sent to create_read_count_panel_of_normals

  deepsomatic_pon:
    type: object
    description: parameters for deepsomatic_pon
    properties:
      model:
        type: string
        minLength: 1
        description: type of model to use for variant calling
      name:
        type: string
        minLength: 1
        description: sample name
      benchmark_repeats:
        type: integer
        description: set number of times benchmark should be repeated
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      extra:
        type: string
        description: parameters that should be forwarded

  exomedepth_bam_list:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  exomedepth_reference:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra parameters sent to exomedepth_reference

  ichorcna_offtarget_read_counter:
    type: object
    description: parameters for ichorcna_offtarget_read_counter
    properties:
      benchmark_repeats:
        type: integer
        description: set number of times benchmark should be repeated
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      chrs:
        type: string
        minLength: 1
        description: comma-separated list of chromosomes to count reads in
      window:
        type: integer
        description: >-
          Bin size in bp used by HMMcopy readCounter. Must match the bin size actually
          baked into whichever gc_wig/map_wig get configured downstream, or R hits a
          length mismatch. ichorCNA's own bundled wigs only ship at 10/50/500/1000kb -
          this rule's 100kb default has no matching bundled file and requires a
          custom-generated gc_wig/map_wig at the same bin size.
      quality:
        type: integer
        description: minimum mapping quality for a read to be counted

  ichorcna_offtarget_wig_list:
    type: object
    description: parameters for ichorcna_offtarget_wig_list
    properties:
      benchmark_repeats:
        type: integer
        description: set number of times benchmark should be repeated
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  ichorcna_offtarget_panel_of_normals:
    type: object
    description: parameters for ichorcna_offtarget_panel_of_normals
    properties:
      benchmark_repeats:
        type: integer
        description: set number of times benchmark should be repeated
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      gc_wig:
        type: string
        minLength: 1
        description: path to GC-content wig file for the reference genome
      map_wig:
        type: string
        minLength: 1
        description: path to mappability score wig file for the reference genome
      centromere:
        type: string
        minLength: 1
        description: path to file containing centromere locations
      chrs:
        type: string
        minLength: 1
        description: chromosomes to analyze, as an R vector expression
      chr_normalize:
        type: string
        minLength: 1
        description: >-
          Chromosomes to normalize GC/mappability biases on, as an R vector expression.
          Currently has no effect: createPanelOfNormals.R parses and re-styles this value
          but never forwards it to loadReadCountsFromWig(), which always uses its own
          hardcoded default (c(1:22, "X", "Y")) instead. Kept here in case a future
          ichorCNA version fixes this upstream.
      genome_style:
        type: string
        minLength: 1
        description: >-
          NCBI or UCSC chromosome naming convention. Must be "NCBI": createPanelOfNormals.R
          never forwards this to its own call to loadReadCountsFromWig(), which defaults to
          NCBI internally regardless, so sample counts always end up NCBI-styled - setting
          "UCSC" here only re-styles chrs/centromere, leaving them mismatched against the
          NCBI-styled counts, and keepChr(counts, chrs) then retains zero bins.
      method:
        type: string
        minLength: 1
        enum: [median, mean]
        description: >-
          Method used to summarize the normal cohort's per-bin values. Must be exactly
          "median" or "mean" (lowercase) - createPanelOfNormals.R does an exact,
          case-sensitive string match and stops on anything else.
      extra:
        type: string
        description: extra parameters sent to createPanelOfNormals.R

  jumble_count:
    type: object
    description: parameters for jumble_count
    properties:
      benchmark_repeats:
        type: integer
        description: set number of times benchmark should be repeated
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      bed:
        type: string
        minLength: 1
        description: path to design bed file

  jumble_reference:
    type: object
    description: parameters for jumble_reference
    properties:
      benchmark_repeats:
        type: integer
        description: set number of times benchmark should be repeated
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      annotation:
        type: string
        minLength: 1
        description: path to annotation file
      bed:
        type: string
        minLength: 1
        description: path to design bed file
      input_dir:
        type: string
        minLength: 1
        description: path to input directory, determined from input files
      output_dir:
        type: string
        minLength: 1
        description: path to output directory

  msisensor_pro_scan:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  msisensor_pro_input_file:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  msisensor_pro_baseline:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra parameters sent to msisensor_pro_baseline

  preprocess_intervals:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      bin_length:
        type: string
        minLength: 1
        description: size of bin regions (WGS 1000, Exomes/target 0)
      padding:
        type: string
        minLength: 1
        description: bases added to design regions (WGS 0, Exomes/target 250)
      extra:
        type: string
        description: extra parameters sent to preprocess_intervals (-imr OVERLAPPING_ONLY)

  purecn_interval_file:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      genome:
        type: string
        minLength: 1
        description: reference genome
      average_off_target_width:
        type: integer
        description: average bin size of off-target regions

  purecn_bam_list:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  purecn_coverage:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra parameters sent to purecn_coverage
      intervals:
        type: string
        minLength: 1
        description: interval panel design file

  purecn_coverage_list:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  purecn_normal_db:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      genome:
        type: string
        minLength: 1
        description: reference genome
      
  svdb_build:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container

  svdb_export:
    type: object
    properties:
      container:
        type: string
        minLength: 1
        description: name or path to docker/singularity container
      extra:
        type: string
        description: extra parameters sent to svdb_export

required:
  - samples
  - units
  - resources
  - default_container
