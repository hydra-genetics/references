on:
  push:
    branches:
      - master

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.8 build
    steps:
      - uses: GoogleCloudPlatform/release-please-action@v2
        id: release
        with:
          release-type: python
          package-name: hydra-genetics
          default-branch: master
