name: CI

on:
  push:
    branches:
      - develop
      - master
    paths:
      - "workflow/**"
      - ".tests/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "config/**"
  pull_request:
    branches:
      - develop
      - master
    paths:
      - "workflow/**"
      - ".tests/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "config/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Linting
        working-directory: .tests/integration
        run: snakemake --lint -n -s ../../workflow/Snakefile --configfile config.yaml

  pycodestyle:
    name: pycodestyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.test.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements.test.txt
      - name: Check python syntax
        run: pycodestyle --max-line-length=130 --statistics workflow/scripts

  snakefmt:
    name: Snakefmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.test.txt
      - name: Install dependencies
        run: pip install -r requirements.test.txt
      - name: Check snakemake formatting
        run: snakefmt --check --config .github/linters/.snakefmt.toml workflow/

  dry-run:
    name: Snakemake dry run
    runs-on: ubuntu-latest
    needs: [lint, pycodestyle, snakefmt]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snakemake dry run
        working-directory: .tests/integration
        run: snakemake -n -s ../../workflow/Snakefile --configfile config.yaml

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [dry-run]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache apptainer images
        id: cache-apptainer
        uses: actions/cache@v4
        with:
          path: ~/singularity_containers
          key: ${{ runner.os }}-apptainer-${{ hashFiles('config/**/*.yaml', '.tests/integration/*.yaml', 'workflow/Snakefile') }}
          restore-keys: |
            ${{ runner.os }}-apptainer
      - name: Create container cache directory
        run: mkdir -p ~/singularity_containers
      - name: Integration test - small dataset
        working-directory: .tests/integration
        run: |
          snakemake -s ../../workflow/Snakefile -j 4 --show-failed-logs \
            --configfiles config.yaml \
            --software-deployment-method apptainer \
            --apptainer-prefix ~/singularity_containers/ \
            --apptainer-args "--cleanenv --bind /home/runner"
